      - expr: max(servers:public_network_traffic:a:web_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 100
      - expr: max(servers:public_network_traffic:b:web_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 300
      - expr: max(servers:public_network_packets:a:web_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 7
      - expr: max(servers:public_network_packets:b:web_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 9
      - expr: max(servers:traffic_this_billing_period:a:web_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 2199023255552
      - expr: max(servers:traffic_this_billing_period:b:web_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 1099511627776

      # Disks 0 and 1 add up; disk 0 reported by two exporter instances counts once
      - expr: max(servers:disk_throughput:a:web_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
