# Tests for the Grafana dashboards: every panel query (queries.yml, generated
# from the dashboard JSON by `go test ./internal/dashboards -update`) is evaluated
# against a small Hetzner project and must return exactly these values.
#   promtool test rules dashboards_test.yml
#
# Data (job "hetzner"): web-1 running in fsn1 and web-2 off in nbg1 (cx22, 2 vCPUs, 4 GiB);
# lb-1 with web-1 healthy and web-2 unhealthy on port 443, lb-2 all healthy; volume "data"
# unattached and "db" on web-1; primary IPs p1 (web-1), p2 (unassigned IPv4), p3 (IPv6 on
# web-1), floating IP f1 (unassigned); snapshot "nightly" (100 days) and a backup of web-1;
# Storage Box box1 half full; certificates "shop" (managed, 30 days) and "old" (2 days).
# Instance "b" repeats some series (the exporter after a restart on a new port): no
# duplicates. Job "other" (another Hetzner project) uses the same names: never shown.
# All values are evaluated at 2h; timestamps are relative to that (7200s).
rule_files:
  - queries.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'hetzner_cloud_server_info{job="hetzner",instance="a",server="web-1",server_id="10",status="running",server_type="cx22",location="fsn1"}'
        values: '1x130'
      - series: 'hetzner_cloud_server_running{job="hetzner",instance="a",server="web-1"}'
        values: '1x130'
