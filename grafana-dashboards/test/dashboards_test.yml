      # Costs: everything of job "hetzner" (servers 10, backup 1, Load Balancers 7.5, volumes 1.5, primary IPs 1, floating IP 3, snapshot 0.25, Storage Box 3.25)
      - expr: max(costs:monthly_cost_net:a)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 27.5
      - expr: max(costs:monthly_cost_over_time_net:a)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 27.5

      # Unassigned p2 (0.5) and f1 (3), unattached "data" (0.5); not "data" of the other job
      - expr: max(costs:unused_resources_net_month:a)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 4
      - expr: max(costs:snapshots_net_month:a)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 0.25

      # web-1 used 2 TiB of 1 TiB at 1 per TiB; web-2 is below its included traffic
      - expr: max(costs:traffic_overage_servers_net:a)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: max by (kind) (costs:cost_by_kind_of_resource_net_month:a)
        eval_time: 2h
        exp_samples:
          - labels: '{kind="server"}'
            value: 10
          - labels: '{kind="server_backup"}'
            value: 1
          - labels: '{kind="load_balancer"}'
            value: 7.5
          - labels: '{kind="volume"}'
            value: 1.5
