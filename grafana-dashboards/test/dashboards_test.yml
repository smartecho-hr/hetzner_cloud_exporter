      # Inventory: servers table (the other job has a web-1 too)
      - expr: max by (server, server_type, location, status) (inventory:servers:a)
        eval_time: 2h
        exp_samples:
          - labels: '{server="web-1",server_type="cx22",location="fsn1",status="running"}'
            value: 1
          - labels: '{server="web-2",server_type="cx22",location="nbg1",status="off"}'
            value: 1
      - expr: max by (server) (inventory:servers:b)
        eval_time: 2h
        exp_samples:
          - labels: '{server="web-1"}'
            value: 2
          - labels: '{server="web-2"}'
            value: 2
      - expr: max by (server) (inventory:servers:c)
        eval_time: 2h
        exp_samples:
          - labels: '{server="web-1"}'
            value: 4294967296
          - labels: '{server="web-2"}'
            value: 4294967296
      - expr: max by (server) (inventory:servers:d)
        eval_time: 2h
        exp_samples:
          - labels: '{server="web-1"}'
            value: 5
          - labels: '{server="web-2"}'
            value: 5
      - expr: max by (server) (inventory:servers:e)
        eval_time: 2h
        exp_samples:
          - labels: '{server="web-1"}'
            value: 1
          - labels: '{server="web-2"}'
            value: 0
      - expr: max by (server) (inventory:servers:f)
        eval_time: 2h
        exp_samples:
          - labels: '{server="web-1"}'
            value: 1
          - labels: '{server="web-2"}'
            value: 0
      - expr: max by (server) (inventory:servers:g)
        eval_time: 2h
        exp_samples:
          - labels: '{server="web-1"}'
            value: 0
          - labels: '{server="web-2"}'
            value: 1

      # Last backup 1.5 days ago; web-2 has no backups
      - expr: max by (server) (inventory:servers:h)
        eval_time: 2h
        exp_samples:
          - labels: '{server="web-1"}'
            value: 1.5

      # Certificates: days left, issuance and renewal status (only managed certificates have one)
      - expr: max by (certificate, certificate_type) (inventory:certificates:a)
        eval_time: 2h
        exp_samples:
          - labels: '{certificate="shop",certificate_type="managed"}'
            value: 30
          - labels: '{certificate="old",certificate_type="uploaded"}'
            value: 2
      - expr: max by (certificate, issuance) (inventory:certificates:b)
        eval_time: 2h
        exp_samples:
          - labels: '{certificate="shop",issuance="completed"}'
            value: 1
      - expr: max by (certificate, renewal) (inventory:certificates:c)
        eval_time: 2h
        exp_samples:
          - labels: '{certificate="shop",renewal="scheduled"}'
            value: 1
      - expr: max by (storage_box) (inventory:storage_boxes:a)
        eval_time: 2h
        exp_samples:
          - labels: '{storage_box="box1"}'
            value: 500
      - expr: max by (storage_box) (inventory:storage_boxes:b)
        eval_time: 2h
        exp_samples:
          - labels: '{storage_box="box1"}'
            value: 1000
      - expr: max by (storage_box) (inventory:storage_boxes:c)
        eval_time: 2h
        exp_samples:
          - labels: '{storage_box="box1"}'
            value: 50

      # Volumes with the name of their server; an unattached volume once, without a server
      - expr: max by (volume, server) (inventory:volumes:a)
        eval_time: 2h
        exp_samples:
          - labels: '{volume="db",server="web-1"}'
            value: 1
          - labels: '{volume="data"}'
            value: 1
      - expr: max by (volume) (inventory:volumes:b)
        eval_time: 2h
        exp_samples:
          - labels: '{volume="data"}'
            value: 10737418240
          - labels: '{volume="db"}'
            value: 21474836480
      - expr: max by (volume) (inventory:volumes:c)
        eval_time: 2h
        exp_samples:
          - labels: '{volume="data"}'
            value: 0
          - labels: '{volume="db"}'
            value: 1
      - expr: max by (volume) (inventory:volumes:d)
        eval_time: 2h
        exp_samples:
          - labels: '{volume="data"}'
            value: 0.5
          - labels: '{volume="db"}'
            value: 1

      # IP addresses with the server they are assigned to; the value is "assigned"
      - expr: max by (kind, name, ip, type, server) (inventory:ip_addresses:a)
        eval_time: 2h
        exp_samples:
          - labels: '{kind="primary",name="p1",ip="1.2.3.4",type="ipv4",server="web-1"}'
            value: 1
          - labels: '{kind="primary",name="p2",ip="5.6.7.8",type="ipv4"}'
            value: 0
          - labels: '{kind="primary",name="p3",ip="2001:db8::/64",type="ipv6",server="web-1"}'
            value: 1
          - labels: '{kind="floating",name="f1",ip="9.9.9.9",type="ipv4"}'
            value: 0

      # Snapshots and backups: age in days, size, price (backups have none)
      - expr: max by (image_id, image, image_type, server) (inventory:snapshots_and_backups:a)
        eval_time: 2h
        exp_samples:
          - labels: '{image_id="5",image="nightly",image_type="snapshot",server="web-1"}'
            value: 1
          - labels: '{image_id="6",image="6",image_type="backup",server="web-1"}'
