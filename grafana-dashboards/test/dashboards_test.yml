            value: 1
          - labels: '{kind="floating_ip"}'
            value: 3
          - labels: '{kind="image"}'
            value: 0.25
          - labels: '{kind="storage_box"}'
            value: 3.25

      # Snapshots are named "description #id" (descriptions are not unique)
      - expr: max by (kind, resource) (costs:most_expensive_resources:a)
        eval_time: 2h
        exp_samples:
          - labels: '{kind="server",resource="web-1"}'
            value: 5
          - labels: '{kind="server",resource="web-2"}'
            value: 5
          - labels: '{kind="server_backup",resource="web-1"}'
            value: 1
          - labels: '{kind="load_balancer",resource="lb-1"}'
