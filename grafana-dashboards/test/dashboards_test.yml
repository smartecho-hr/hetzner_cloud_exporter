      - expr: max by (image_id) (inventory:snapshots_and_backups:c)
        eval_time: 2h
        exp_samples:
          - labels: '{image_id="5"}'
            value: 10737418240
          - labels: '{image_id="6"}'
            value: 21474836480
      - expr: max by (image_id) (inventory:snapshots_and_backups:d)
        eval_time: 2h
        exp_samples:
          - labels: '{image_id="5"}'
            value: 0.25

      # Load Balancer gauges in % of the type limits (lb-1); the other job has 9999 connections on its lb-1
      - expr: max(loadbalancer:connections:a:lb_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 40
      - expr: max(loadbalancer:targets:a:lb_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 40
      - expr: max(loadbalancer:services:a:lb_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 20
      - expr: max(loadbalancer:certificates:a:lb_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 10
      - expr: max(loadbalancer:traffic:a:lb_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 50

      # No data for lb-2: "No data", not 0%
      - expr: max(loadbalancer:connections:a:lb_2)
        eval_time: 2h
        exp_samples: []

      # web-2 is unhealthy on lb-1
      - expr: max(loadbalancer:unhealthy_targets:a:lb_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 1

      # lb-2 reports targets, all healthy: 0 (not "No data"); the other job's unhealthy target on its lb-2 doesn't count
      - expr: max(loadbalancer:unhealthy_targets:a:lb_2)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 0
      - expr: max by (load_balancer_type) (loadbalancer:type:a:lb_1)
        eval_time: 2h
        exp_samples:
          - labels: '{load_balancer_type="lb11"}'
            value: 1
      - expr: max(loadbalancer:requests_per_second:a:lb_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 12

      # Bandwidth in bit/s
      - expr: max(loadbalancer:bandwidth:a:lb_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 8000
      - expr: max(loadbalancer:bandwidth:b:lb_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 16000
      - expr: max(loadbalancer:connections_per_second:a:lb_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 3
      - expr: max(loadbalancer:open_connections:a:lb_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 4000
      - expr: max(loadbalancer:open_connections:b:lb_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 10000

      # Target health: 2 healthy, 1 unknown, 0 unhealthy
      - expr: max by (server, listen_port) (loadbalancer:target_health:a:lb_1)
        eval_time: 2h
        exp_samples:
          - labels: '{server="web-1",listen_port="443"}'
            value: 2
          - labels: '{server="web-2",listen_port="443"}'
            value: 0
      - expr: max by (server, listen_port) (loadbalancer:target_health:a:lb_2)
        eval_time: 2h
        exp_samples:
          - labels: '{server="web-1",listen_port="80"}'
            value: 2

      # Targets not healthy, with the reason; one "all healthy" row when every target is healthy
      - expr: max by (server, listen_port, status, detail) (loadbalancer:targets_not_healthy_with_reason:a:lb_1)
        eval_time: 2h
        exp_samples:
          - labels: '{server="web-2",listen_port="443",status="unhealthy",detail="layer4_no_connection"}'
            value: 1
      - expr: max by (status) (loadbalancer:targets_not_healthy_with_reason:a:lb_2)
        eval_time: 2h
        exp_samples:
          - labels: '{status="✓ All targets are healthy"}'
            value: 1
      - expr: max(loadbalancer:connection_usage_of_the_type_s_limit:a:lb_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 40

      # Server web-1: CPU 25 % of all vCPUs (the other job's web-1 has 90 %), price incl. backups 5 + 1
      - expr: max(servers:cpu:a:web_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 25
      - expr: max(servers:cpu_usage:a:web_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 25
      - expr: max(servers:traffic:a:web_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 200
      - expr: max(servers:status:a:web_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: max(servers:vcpus:a:web_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 2
      - expr: max(servers:memory:a:web_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 4294967296
      - expr: max(servers:disk:a:web_1)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
