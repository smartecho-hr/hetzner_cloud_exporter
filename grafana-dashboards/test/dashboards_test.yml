            value: 0.5
          - labels: '{kind="volume",resource="db"}'
            value: 1
          - labels: '{kind="primary_ip",resource="p1"}'
            value: 0.5
          - labels: '{kind="primary_ip",resource="p2"}'
            value: 0.5
          - labels: '{kind="floating_ip",resource="f1"}'
            value: 3
          - labels: '{kind="image",resource="nightly #5"}'
            value: 0.25
          - labels: '{kind="storage_box",resource="box1"}'
            value: 3.25
      - expr: max by (resource) (costs:unused_resources_that_cost_money:a)
        eval_time: 2h
        exp_samples:
          - labels: '{resource="primary IP p2"}'
            value: 0.5
          - labels: '{resource="floating IP f1"}'
            value: 3
          - labels: '{resource="volume data"}'
            value: 0.5

      # Exporter health (the other job has 5000 requests/hour and version v9.9.9)
      - expr: max(exporter:api_requests_per_hour:a)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 900
      - expr: max(exporter:rate_limit_remaining:a)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 3000
      - expr: max(exporter:poll_interval:a)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 60
      - expr: max(exporter:poll_duration:a)
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 1.5
      - expr: max by (version) (exporter:version:a)
        eval_time: 2h
        exp_samples:
          - labels: '{version="v0.4.1"}'
            value: 1

      # Sources table: last poll, data age, interval, errors in the last hour (images fail once a minute)
      - expr: max by (source) (exporter:sources:a)
        eval_time: 2h
        exp_samples:
          - labels: '{source="servers"}'
            value: 1
          - labels: '{source="images"}'
            value: 0
      - expr: max by (source) (exporter:sources:b)
        eval_time: 2h
        exp_samples:
          - labels: '{source="servers"}'
            value: 60
          - labels: '{source="images"}'
            value: 600
      - expr: max by (source) (exporter:sources:c)
        eval_time: 2h
        exp_samples:
          - labels: '{source="servers"}'
            value: 60
          - labels: '{source="images"}'
            value: 600
      - expr: max by (source) (exporter:sources:d)
        eval_time: 2h
        exp_samples:
          - labels: '{source="servers"}'
            value: 0
          - labels: '{source="images"}'
            value: 60

      # 10 responses a minute = 600 per hour
      - expr: max by (code) (exporter:api_responses_by_status_per_hour:a)
        eval_time: 2h
        exp_samples:
          - labels: '{code="200"}'
            value: 600
          - labels: '{code="429"}'
            value: 0
      - expr: max by (cause) (exporter:metrics_errors:a)
        eval_time: 2h
        exp_samples:
          - labels: '{cause="gathering"}'
