# Generated by `go test ./internal/dashboards -update` from grafana-dashboards/*.json.
# Every panel query as a recording rule; tested in dashboards_test.yml. Don't edit.
groups:
  - name: dashboards
    rules:
      - record: costs:monthly_cost_net:a
        expr: "sum(max by (__name__, server, load_balancer, volume, floating_ip, primary_ip, image_id, storage_box) ({job=\"hetzner\", __name__=~\"hetzner_cloud_.+_monthly_price\"}))"
      - record: costs:unused_resources_net_month:a
        expr: "(sum(max by (primary_ip) (hetzner_cloud_primary_ip_monthly_price{job=\"hetzner\"}) and on (primary_ip) (max by (primary_ip) (hetzner_cloud_primary_ip_assigned{job=\"hetzner\"}) == 0)) or vector(0)) + (sum(max by (floating_ip) (hetzner_cloud_floating_ip_monthly_price{job=\"hetzner\"}) and on (floating_ip) (max by (floating_ip) (hetzner_cloud_floating_ip_assigned{job=\"hetzner\"}) == 0)) or vector(0)) + (sum(max by (volume) (hetzner_cloud_volume_monthly_price{job=\"hetzner\"}) and on (volume) (max by (volume) (hetzner_cloud_volume_attached{job=\"hetzner\"}) == 0)) or vector(0))"
      - record: costs:snapshots_net_month:a
        expr: "sum(max by (image_id) (hetzner_cloud_image_monthly_price{job=\"hetzner\"}))"
      - record: costs:traffic_overage_servers_net:a
        expr: "sum(clamp_min(max by (server) (hetzner_cloud_server_outgoing_traffic_bytes{job=\"hetzner\"}) - max by (server) (hetzner_cloud_server_included_traffic_bytes{job=\"hetzner\"} \u003e 0), 0) / 1099511627776 * on (server) max by (server) (hetzner_cloud_server_traffic_price_per_tb{job=\"hetzner\"})) or vector(0)"
      - record: costs:cost_by_kind_of_resource_net_month:a
        expr: "label_replace(sum by (__name__) (max by (__name__, server, load_balancer, volume, floating_ip, primary_ip, image_id, storage_box) ({job=\"hetzner\", __name__=~\"hetzner_cloud_.+_monthly_price\"})), \"kind\", \"$1\", \"__name__\", \"hetzner_cloud_(.+)_monthly_price\")"
      - record: costs:monthly_cost_over_time_net:a
        expr: "sum(max by (__name__, server, load_balancer, volume, floating_ip, primary_ip, image_id, storage_box) ({job=\"hetzner\", __name__=~\"hetzner_cloud_.+_monthly_price\"}))"
      - record: costs:most_expensive_resources:a
        expr: "label_replace(topk(20, label_join(label_replace(label_join(max by (__name__, server, load_balancer, volume, floating_ip, primary_ip, image, image_id, storage_box) ({job=\"hetzner\", __name__=~\"hetzner_cloud_.+_monthly_price\"}), \"snapshot\", \" #\", \"image\", \"image_id\"), \"snapshot\", \"\", \"snapshot\", \" #\"), \"resource\", \"\", \"server\", \"load_balancer\", \"volume\", \"floating_ip\", \"primary_ip\", \"snapshot\", \"storage_box\")), \"kind\", \"$1\", \"__name__\", \"hetzner_cloud_(.+)_monthly_price\")"
      - record: costs:unused_resources_that_cost_money:a
        expr: "label_replace(max by (primary_ip) (hetzner_cloud_primary_ip_monthly_price{job=\"hetzner\"}) and on (primary_ip) (max by (primary_ip) (hetzner_cloud_primary_ip_assigned{job=\"hetzner\"}) == 0), \"resource\", \"primary IP $1\", \"primary_ip\", \"(.*)\") or label_replace(max by (floating_ip) (hetzner_cloud_floating_ip_monthly_price{job=\"hetzner\"}) and on (floating_ip) (max by (floating_ip) (hetzner_cloud_floating_ip_assigned{job=\"hetzner\"}) == 0), \"resource\", \"floating IP $1\", \"floating_ip\", \"(.*)\") or label_replace(max by (volume) (hetzner_cloud_volume_monthly_price{job=\"hetzner\"}) and on (volume) (max by (volume) (hetzner_cloud_volume_attached{job=\"hetzner\"}) == 0), \"resource\", \"volume $1\", \"volume\", \"(.*)\")"
      - record: exporter:api_requests_per_hour:a
        expr: "max(hetzner_cloud_exporter_api_requests_per_hour_estimate{job=\"hetzner\"})"
      - record: exporter:rate_limit_remaining:a
        expr: "min(hetzner_cloud_exporter_api_rate_limit_remaining{job=\"hetzner\"})"
      - record: exporter:poll_interval:a
        expr: "max(hetzner_cloud_exporter_poll_interval_seconds{job=\"hetzner\"})"
      - record: exporter:version:a
        expr: "max by (version) (hetzner_cloud_exporter_build_info{job=\"hetzner\"})"
      - record: exporter:sources:a
        expr: "max by (source) (hetzner_cloud_exporter_last_poll_success{job=\"hetzner\"})"
      - record: exporter:sources:b
        expr: "max by (source) (time() - hetzner_cloud_exporter_last_success_timestamp_seconds{job=\"hetzner\"})"
      - record: exporter:sources:c
        expr: "max by (source) (hetzner_cloud_exporter_source_interval_seconds{job=\"hetzner\"})"
      - record: exporter:sources:d
        expr: "sum by (source) (increase(hetzner_cloud_exporter_poll_errors_total{job=\"hetzner\"}[1h]))"
      - record: exporter:api_responses_by_status_per_hour:a
        expr: "sum by (code) (rate(hetzner_cloud_exporter_api_responses_total{job=\"hetzner\"}[5m])) * 3600"
      - record: exporter:poll_duration:a
        expr: "max(hetzner_cloud_exporter_poll_duration_seconds{job=\"hetzner\"})"
      - record: exporter:metrics_errors:a
        expr: "sum by (cause) (increase(promhttp_metric_handler_errors_total{job=\"hetzner\"}[15m]))"
      - record: inventory:servers:a
        expr: "max by (server, server_type, location, status) (hetzner_cloud_server_info{job=\"hetzner\"})"
      - record: inventory:servers:b
        expr: "max by (server) (hetzner_cloud_server_cpu_cores{job=\"hetzner\"})"
      - record: inventory:servers:c
        expr: "max by (server) (hetzner_cloud_server_memory_bytes{job=\"hetzner\"})"
      - record: inventory:servers:d
        expr: "max by (server) (hetzner_cloud_server_monthly_price{job=\"hetzner\"})"
      - record: inventory:servers:e
        expr: "max by (server) (hetzner_cloud_server_backup_enabled{job=\"hetzner\"})"
      - record: inventory:servers:f
        expr: "max by (server) (hetzner_cloud_server_delete_protection{job=\"hetzner\"})"
      - record: inventory:servers:g
        expr: "max by (server) (hetzner_cloud_server_type_deprecated{job=\"hetzner\"})"
      - record: inventory:servers:h
        expr: "max by (server) ((time() - hetzner_cloud_server_last_backup_timestamp_seconds{job=\"hetzner\"}) / 86400)"
      - record: inventory:certificates:a
        expr: "max by (certificate, certificate_type) ((hetzner_cloud_certificate_not_valid_after_timestamp_seconds{job=\"hetzner\"} - time()) / 86400)"
      - record: inventory:certificates:b
        expr: "max by (certificate, issuance) (label_replace(hetzner_cloud_certificate_status{job=\"hetzner\", process=\"issuance\"}, \"issuance\", \"$1\", \"status\", \"(.*)\"))"
      - record: inventory:certificates:c
        expr: "max by (certificate, renewal) (label_replace(hetzner_cloud_certificate_status{job=\"hetzner\", process=\"renewal\"}, \"renewal\", \"$1\", \"status\", \"(.*)\"))"
      - record: inventory:storage_boxes:a
        expr: "max by (storage_box) (hetzner_cloud_storage_box_used_bytes{job=\"hetzner\"})"
      - record: inventory:storage_boxes:b
        expr: "max by (storage_box) (hetzner_cloud_storage_box_quota_bytes{job=\"hetzner\"})"
      - record: inventory:storage_boxes:c
        expr: "100 * max by (storage_box) (hetzner_cloud_storage_box_used_bytes{job=\"hetzner\"}) / max by (storage_box) (hetzner_cloud_storage_box_quota_bytes{job=\"hetzner\"} \u003e 0)"
      - record: inventory:volumes:a
        expr: "(max by (volume, location, server_id) (hetzner_cloud_volume_info{job=\"hetzner\"}) * on (server_id) group_left (server) max by (server_id, server) (hetzner_cloud_server_info{job=\"hetzner\"})) or (max by (volume, location, server_id) (hetzner_cloud_volume_info{job=\"hetzner\"}) unless on (volume) (max by (volume, location, server_id) (hetzner_cloud_volume_info{job=\"hetzner\"}) * on (server_id) group_left (server) max by (server_id, server) (hetzner_cloud_server_info{job=\"hetzner\"})))"
      - record: inventory:volumes:b
        expr: "max by (volume) (hetzner_cloud_volume_size_bytes{job=\"hetzner\"})"
      - record: inventory:volumes:c
        expr: "max by (volume) (hetzner_cloud_volume_attached{job=\"hetzner\"})"
      - record: inventory:volumes:d
        expr: "max by (volume) (hetzner_cloud_volume_monthly_price{job=\"hetzner\"})"
      - record: inventory:ip_addresses:a
        expr: "label_replace(label_replace(((label_replace(max by (primary_ip, ip, primary_ip_type, location, server_id) (hetzner_cloud_primary_ip_info{job=\"hetzner\"}), \"type\", \"$1\", \"primary_ip_type\", \"(.*)\") * on (server_id) group_left (server) max by (server_id, server) (hetzner_cloud_server_info{job=\"hetzner\"})) or (label_replace(max by (primary_ip, ip, primary_ip_type, location, server_id) (hetzner_cloud_primary_ip_info{job=\"hetzner\"}), \"type\", \"$1\", \"primary_ip_type\", \"(.*)\") unless on (primary_ip) (label_replace(max by (primary_ip, ip, primary_ip_type, location, server_id) (hetzner_cloud_primary_ip_info{job=\"hetzner\"}), \"type\", \"$1\", \"primary_ip_type\", \"(.*)\") * on (server_id) group_left (server) max by (server_id, server) (hetzner_cloud_server_info{job=\"hetzner\"})))) * on (primary_ip) group_left max by (primary_ip) (hetzner_cloud_primary_ip_assigned{job=\"hetzner\"}), \"name\", \"$1\", \"primary_ip\", \"(.*)\"), \"kind\", \"primary\", \"\", \"\") or label_replace(label_replace(((label_replace(max by (floating_ip, ip, floating_ip_type, location, server_id) (hetzner_cloud_floating_ip_info{job=\"hetzner\"}), \"type\", \"$1\", \"floating_ip_type\", \"(.*)\") * on (server_id) group_left (server) max by (server_id, server) (hetzner_cloud_server_info{job=\"hetzner\"})) or (label_replace(max by (floating_ip, ip, floating_ip_type, location, server_id) (hetzner_cloud_floating_ip_info{job=\"hetzner\"}), \"type\", \"$1\", \"floating_ip_type\", \"(.*)\") unless on (floating_ip) (label_replace(max by (floating_ip, ip, floating_ip_type, location, server_id) (hetzner_cloud_floating_ip_info{job=\"hetzner\"}), \"type\", \"$1\", \"floating_ip_type\", \"(.*)\") * on (server_id) group_left (server) max by (server_id, server) (hetzner_cloud_server_info{job=\"hetzner\"})))) * on (floating_ip) group_left max by (floating_ip) (hetzner_cloud_floating_ip_assigned{job=\"hetzner\"}), \"name\", \"$1\", \"floating_ip\", \"(.*)\"), \"kind\", \"floating\", \"\", \"\")"
      - record: inventory:snapshots_and_backups:a
        expr: "max by (image_id, image, image_type, server) (hetzner_cloud_image_info{job=\"hetzner\"})"
      - record: inventory:snapshots_and_backups:b
        expr: "max by (image_id) ((time() - hetzner_cloud_image_created_timestamp_seconds{job=\"hetzner\"}) / 86400)"
      - record: inventory:snapshots_and_backups:c
        expr: "max by (image_id) (hetzner_cloud_image_size_bytes{job=\"hetzner\"})"
      - record: inventory:snapshots_and_backups:d
        expr: "max by (image_id) (hetzner_cloud_image_monthly_price{job=\"hetzner\"})"
      - record: loadbalancer:connections:a:lb_1
        expr: "100 * max(hetzner_cloud_load_balancer_open_connections{job=\"hetzner\", load_balancer=\"lb-1\"}) / max(hetzner_cloud_load_balancer_max_connections{job=\"hetzner\", load_balancer=\"lb-1\"} \u003e 0)"
      - record: loadbalancer:connections:a:lb_2
        expr: "100 * max(hetzner_cloud_load_balancer_open_connections{job=\"hetzner\", load_balancer=\"lb-2\"}) / max(hetzner_cloud_load_balancer_max_connections{job=\"hetzner\", load_balancer=\"lb-2\"} \u003e 0)"
      - record: loadbalancer:targets:a:lb_1
        expr: "100 * max(hetzner_cloud_load_balancer_targets{job=\"hetzner\", load_balancer=\"lb-1\"}) / max(hetzner_cloud_load_balancer_max_targets{job=\"hetzner\", load_balancer=\"lb-1\"} \u003e 0)"
      - record: loadbalancer:targets:a:lb_2
        expr: "100 * max(hetzner_cloud_load_balancer_targets{job=\"hetzner\", load_balancer=\"lb-2\"}) / max(hetzner_cloud_load_balancer_max_targets{job=\"hetzner\", load_balancer=\"lb-2\"} \u003e 0)"
      - record: loadbalancer:services:a:lb_1
        expr: "100 * max(hetzner_cloud_load_balancer_services{job=\"hetzner\", load_balancer=\"lb-1\"}) / max(hetzner_cloud_load_balancer_max_services{job=\"hetzner\", load_balancer=\"lb-1\"} \u003e 0)"
      - record: loadbalancer:services:a:lb_2
        expr: "100 * max(hetzner_cloud_load_balancer_services{job=\"hetzner\", load_balancer=\"lb-2\"}) / max(hetzner_cloud_load_balancer_max_services{job=\"hetzner\", load_balancer=\"lb-2\"} \u003e 0)"
      - record: loadbalancer:certificates:a:lb_1
        expr: "100 * max(hetzner_cloud_load_balancer_certificates{job=\"hetzner\", load_balancer=\"lb-1\"}) / max(hetzner_cloud_load_balancer_max_certificates{job=\"hetzner\", load_balancer=\"lb-1\"} \u003e 0)"
      - record: loadbalancer:certificates:a:lb_2
        expr: "100 * max(hetzner_cloud_load_balancer_certificates{job=\"hetzner\", load_balancer=\"lb-2\"}) / max(hetzner_cloud_load_balancer_max_certificates{job=\"hetzner\", load_balancer=\"lb-2\"} \u003e 0)"
      - record: loadbalancer:traffic:a:lb_1
        expr: "100 * max(hetzner_cloud_load_balancer_outgoing_traffic_bytes{job=\"hetzner\", load_balancer=\"lb-1\"}) / max(hetzner_cloud_load_balancer_included_traffic_bytes{job=\"hetzner\", load_balancer=\"lb-1\"} \u003e 0)"
      - record: loadbalancer:traffic:a:lb_2
        expr: "100 * max(hetzner_cloud_load_balancer_outgoing_traffic_bytes{job=\"hetzner\", load_balancer=\"lb-2\"}) / max(hetzner_cloud_load_balancer_included_traffic_bytes{job=\"hetzner\", load_balancer=\"lb-2\"} \u003e 0)"
      - record: loadbalancer:unhealthy_targets:a:lb_1
        expr: "count(max by (load_balancer, target_type, server, server_id, ip) (hetzner_cloud_load_balancer_target_unhealthy_services{job=\"hetzner\", load_balancer=\"lb-1\", target_type!=\"\"}) \u003e 0) or (0 * count(hetzner_cloud_load_balancer_target_unhealthy_services{job=\"hetzner\", load_balancer=\"lb-1\"}))"
      - record: loadbalancer:unhealthy_targets:a:lb_2
        expr: "count(max by (load_balancer, target_type, server, server_id, ip) (hetzner_cloud_load_balancer_target_unhealthy_services{job=\"hetzner\", load_balancer=\"lb-2\", target_type!=\"\"}) \u003e 0) or (0 * count(hetzner_cloud_load_balancer_target_unhealthy_services{job=\"hetzner\", load_balancer=\"lb-2\"}))"
      - record: loadbalancer:type:a:lb_1
        expr: "max by (load_balancer_type) (hetzner_cloud_load_balancer_info{job=\"hetzner\", load_balancer=\"lb-1\"})"
      - record: loadbalancer:type:a:lb_2
        expr: "max by (load_balancer_type) (hetzner_cloud_load_balancer_info{job=\"hetzner\", load_balancer=\"lb-2\"})"
      - record: loadbalancer:requests_per_second:a:lb_1
        expr: "max by (load_balancer) (hetzner_cloud_load_balancer_requests_per_second{job=\"hetzner\", load_balancer=\"lb-1\"})"
      - record: loadbalancer:requests_per_second:a:lb_2
        expr: "max by (load_balancer) (hetzner_cloud_load_balancer_requests_per_second{job=\"hetzner\", load_balancer=\"lb-2\"})"
      - record: loadbalancer:bandwidth:a:lb_1
        expr: "max by (load_balancer) (hetzner_cloud_load_balancer_bandwidth_bytes_per_second{job=\"hetzner\", load_balancer=\"lb-1\", direction=\"in\"}) * 8"
      - record: loadbalancer:bandwidth:a:lb_2
        expr: "max by (load_balancer) (hetzner_cloud_load_balancer_bandwidth_bytes_per_second{job=\"hetzner\", load_balancer=\"lb-2\", direction=\"in\"}) * 8"
      - record: loadbalancer:bandwidth:b:lb_1
        expr: "max by (load_balancer) (hetzner_cloud_load_balancer_bandwidth_bytes_per_second{job=\"hetzner\", load_balancer=\"lb-1\", direction=\"out\"}) * 8"
      - record: loadbalancer:bandwidth:b:lb_2
        expr: "max by (load_balancer) (hetzner_cloud_load_balancer_bandwidth_bytes_per_second{job=\"hetzner\", load_balancer=\"lb-2\", direction=\"out\"}) * 8"
      - record: loadbalancer:connections_per_second:a:lb_1
        expr: "max by (load_balancer) (hetzner_cloud_load_balancer_connections_per_second{job=\"hetzner\", load_balancer=\"lb-1\"})"
      - record: loadbalancer:connections_per_second:a:lb_2
        expr: "max by (load_balancer) (hetzner_cloud_load_balancer_connections_per_second{job=\"hetzner\", load_balancer=\"lb-2\"})"
      - record: loadbalancer:open_connections:a:lb_1
        expr: "max by (load_balancer) (hetzner_cloud_load_balancer_open_connections{job=\"hetzner\", load_balancer=\"lb-1\"})"
      - record: loadbalancer:open_connections:a:lb_2
        expr: "max by (load_balancer) (hetzner_cloud_load_balancer_open_connections{job=\"hetzner\", load_balancer=\"lb-2\"})"
      - record: loadbalancer:open_connections:b:lb_1
        expr: "max by (load_balancer) (hetzner_cloud_load_balancer_max_connections{job=\"hetzner\", load_balancer=\"lb-1\"})"
      - record: loadbalancer:open_connections:b:lb_2
        expr: "max by (load_balancer) (hetzner_cloud_load_balancer_max_connections{job=\"hetzner\", load_balancer=\"lb-2\"})"
      - record: loadbalancer:target_health:a:lb_1
        expr: "max by (load_balancer, target_type, server, server_id, ip, listen_port) (2 * hetzner_cloud_load_balancer_target_health_status{job=\"hetzner\", load_balancer=\"lb-1\", status=\"healthy\"} or 1 * hetzner_cloud_load_balancer_target_health_status{job=\"hetzner\", load_balancer=\"lb-1\", status=\"unknown\"} or 0 * hetzner_cloud_load_balancer_target_health_status{job=\"hetzner\", load_balancer=\"lb-1\", status=\"unhealthy\"})"
      - record: loadbalancer:target_health:a:lb_2
        expr: "max by (load_balancer, target_type, server, server_id, ip, listen_port) (2 * hetzner_cloud_load_balancer_target_health_status{job=\"hetzner\", load_balancer=\"lb-2\", status=\"healthy\"} or 1 * hetzner_cloud_load_balancer_target_health_status{job=\"hetzner\", load_balancer=\"lb-2\", status=\"unknown\"} or 0 * hetzner_cloud_load_balancer_target_health_status{job=\"hetzner\", load_balancer=\"lb-2\", status=\"unhealthy\"})"
      - record: loadbalancer:targets_not_healthy_with_reason:a:lb_1
        expr: "max by (load_balancer, target_type, server, server_id, ip, listen_port, status, detail, http_status_code) (hetzner_cloud_load_balancer_target_health_status{job=\"hetzner\", load_balancer=\"lb-1\", status!=\"healthy\"}) or on () (label_replace(vector(1), \"status\", \"✓ All targets are healthy\", \"\", \"\") and on () count(hetzner_cloud_load_balancer_target_health_status{job=\"hetzner\", load_balancer=\"lb-1\"}) \u003e 0)"
      - record: loadbalancer:targets_not_healthy_with_reason:a:lb_2
        expr: "max by (load_balancer, target_type, server, server_id, ip, listen_port, status, detail, http_status_code) (hetzner_cloud_load_balancer_target_health_status{job=\"hetzner\", load_balancer=\"lb-2\", status!=\"healthy\"}) or on () (label_replace(vector(1), \"status\", \"✓ All targets are healthy\", \"\", \"\") and on () count(hetzner_cloud_load_balancer_target_health_status{job=\"hetzner\", load_balancer=\"lb-2\"}) \u003e 0)"
      - record: loadbalancer:connection_usage_of_the_type_s_limit:a:lb_1
        expr: "100 * max(hetzner_cloud_load_balancer_open_connections{job=\"hetzner\", load_balancer=\"lb-1\"}) / max(hetzner_cloud_load_balancer_max_connections{job=\"hetzner\", load_balancer=\"lb-1\"} \u003e 0)"
      - record: loadbalancer:connection_usage_of_the_type_s_limit:a:lb_2
        expr: "100 * max(hetzner_cloud_load_balancer_open_connections{job=\"hetzner\", load_balancer=\"lb-2\"}) / max(hetzner_cloud_load_balancer_max_connections{job=\"hetzner\", load_balancer=\"lb-2\"} \u003e 0)"
      - record: servers:cpu:a:web_1
        expr: "100 * max(hetzner_cloud_server_cpu_usage_ratio{job=\"hetzner\", server=\"web-1\"})"
      - record: servers:cpu:a:web_2
        expr: "100 * max(hetzner_cloud_server_cpu_usage_ratio{job=\"hetzner\", server=\"web-2\"})"
      - record: servers:traffic:a:web_1
        expr: "100 * max(hetzner_cloud_server_outgoing_traffic_bytes{job=\"hetzner\", server=\"web-1\"}) / max(hetzner_cloud_server_included_traffic_bytes{job=\"hetzner\", server=\"web-1\"} \u003e 0)"
      - record: servers:traffic:a:web_2
        expr: "100 * max(hetzner_cloud_server_outgoing_traffic_bytes{job=\"hetzner\", server=\"web-2\"}) / max(hetzner_cloud_server_included_traffic_bytes{job=\"hetzner\", server=\"web-2\"} \u003e 0)"
      - record: servers:status:a:web_1
        expr: "max(hetzner_cloud_server_running{job=\"hetzner\", server=\"web-1\"})"
      - record: servers:status:a:web_2
        expr: "max(hetzner_cloud_server_running{job=\"hetzner\", server=\"web-2\"})"
      - record: servers:type:a:web_1
        expr: "max by (server_type, location) (hetzner_cloud_server_info{job=\"hetzner\", server=\"web-1\"})"
      - record: servers:type:a:web_2
        expr: "max by (server_type, location) (hetzner_cloud_server_info{job=\"hetzner\", server=\"web-2\"})"
      - record: servers:vcpus:a:web_1
        expr: "max(hetzner_cloud_server_cpu_cores{job=\"hetzner\", server=\"web-1\"})"
      - record: servers:vcpus:a:web_2
        expr: "max(hetzner_cloud_server_cpu_cores{job=\"hetzner\", server=\"web-2\"})"
      - record: servers:memory:a:web_1
        expr: "max(hetzner_cloud_server_memory_bytes{job=\"hetzner\", server=\"web-1\"})"
      - record: servers:memory:a:web_2
        expr: "max(hetzner_cloud_server_memory_bytes{job=\"hetzner\", server=\"web-2\"})"
      - record: servers:disk:a:web_1
        expr: "max(hetzner_cloud_server_disk_bytes{job=\"hetzner\", server=\"web-1\"})"
      - record: servers:disk:a:web_2
        expr: "max(hetzner_cloud_server_disk_bytes{job=\"hetzner\", server=\"web-2\"})"
      - record: servers:monthly_price_net:a:web_1
        expr: "max(hetzner_cloud_server_monthly_price{job=\"hetzner\", server=\"web-1\"}) + (max(hetzner_cloud_server_backup_monthly_price{job=\"hetzner\", server=\"web-1\"}) or vector(0))"
      - record: servers:monthly_price_net:a:web_2
        expr: "max(hetzner_cloud_server_monthly_price{job=\"hetzner\", server=\"web-2\"}) + (max(hetzner_cloud_server_backup_monthly_price{job=\"hetzner\", server=\"web-2\"}) or vector(0))"
      - record: servers:backups:a:web_1
        expr: "max(hetzner_cloud_server_backup_enabled{job=\"hetzner\", server=\"web-1\"})"
      - record: servers:backups:a:web_2
        expr: "max(hetzner_cloud_server_backup_enabled{job=\"hetzner\", server=\"web-2\"})"
      - record: servers:delete_protection:a:web_1
