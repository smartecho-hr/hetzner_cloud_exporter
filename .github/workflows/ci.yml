name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -cover
      - name: Lint
        # Built with the project's Go version; a prebuilt golangci-lint built
        # with an older Go refuses this module.
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: promtool check and test (alerts and dashboard queries)
        run: |
          docker run --rm -v "$PWD/prometheus:/rules:ro" -w /rules --entrypoint promtool \
            prom/prometheus:v3.15.0 check rules alerts.yml
          docker run --rm -v "$PWD/prometheus:/rules:ro" -w /rules --entrypoint promtool \
            prom/prometheus:v3.15.0 test rules alerts_test.yml
          docker run --rm -v "$PWD/grafana-dashboards/test:/rules:ro" -w /rules --entrypoint promtool \
            prom/prometheus:v3.15.0 test rules dashboards_test.yml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # git describe needs the tags
          persist-credentials: false
      - name: Build image
        run: |
          docker build -f docker/Dockerfile -t hetzner-cloud-exporter:ci \
            --build-arg VERSION=$(git describe --tags --always) \
            --build-arg COMMIT=$(git rev-parse --short HEAD) \
            --build-arg BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME} \
            --build-arg SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) .
          docker run --rm --network none hetzner-cloud-exporter:ci --version
